# @package _global_
tag: default

num_nodes: 1
devices: 1
seed: 42

training: true
final_eval: false
final_test: false

model:
  num_classes: 2

adversarial:
  enabled: false
  defense:
    enabled: false  # Set to true for adversarial training
    attack_type: fgsm
    attack_params:
      eps: 0.3
  evaluation:
    fgsm:
      enabled: true
      eps: 0.3

data_module:
  data_root: "data/"
  cfg:
    batch_size: 64
    num_workers: 4
    pin_memory: true

criterion:
  label_smoothing: 0.1

scheduler:
  t_initial: ${trainer.max_epochs}
  t_in_epochs: true
  warmup_t: 0
  warmup_lr_init: 0.0
  warmup_prefix: true
  seed: ${seed}

optimizer:
  lr: 1e-3
  weight_decay: 0.05

callbacks:
  lr_monitor:
    _target_: 'lightning.pytorch.callbacks.LearningRateMonitor'
    logging_interval: epoch
  progress_bar:
    _target_: 'lightning.pytorch.callbacks.TQDMProgressBar'
  model_checkpoint:
    _target_: 'lightning.pytorch.callbacks.ModelCheckpoint'
    dirpath: '/checkpoints/'
    filename: 'chkp-{epoch:02d}-{val_loss:.2f}'
    monitor: 'val_loss'

io:
  base_output_path: "outputs/"
  version: 0

trainer:
  accelerator: gpu
  num_nodes: ${num_nodes}
  devices: ${devices}
  precision: '16-mixed'
  max_epochs: 100

defaults:
  - data_module: pcam
  - scheduler: cosine_lr
  - model: resnet 
  - criterion: ce_criterion