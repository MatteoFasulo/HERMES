[project]
name = "fasulobabboniomelchenko2425"
version = "0.1.0"
description = "Project focused on ensuring healthcare ethics and robustness in medical image systems. It is part of the Ethics in AI course at the University of Bologna, and it aims to provide a framework for training and evaluating medical image models with a focus on ethical considerations and robustness."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "adversarial-robustness-toolbox>=1.19.1",
    "gdown>=5.2.0",
    "h5py>=3.13.0",
    "hydra-core>=1.3.2",
    "iprogress>=0.4",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "jsonargparse[signatures]>=4.40.0",
    "lightning>=2.5.1.post0",
    "litmodels>=0.1.8",
    "numpy>=2.2.6",
    "omegaconf>=2.3.0",
    "pandas>=2.2.3",
    "scikit-learn>=1.6.1",
    "tensorboard>=2.19.0",
    "tensorboardx>=2.6.2.2",
    "timm>=1.0.15",
    "torch-tb-profiler>=0.4.3",
    "torchvision>=0.22.0",
    "tqdm>=4.67.1",
    "tsnecuda>=3.0.0",
    "umap-learn>=0.5.7",
]

[[tool.uv.index]]
name = "tsnecuda"
url = "https://tsnecuda.isx.ai/tsnecuda_stable.html"
explicit = true
